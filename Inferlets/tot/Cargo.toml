[package]
name = "tot"
version = "0.1.0"
edition = "2024"
description = "Tree-of-thought inferlet: a thin shell over tot-core. No HTTP, no SSE."

[lib]
crate-type = ["cdylib"]

[dependencies]
inferlet = { path = "../../Vendor/pie/sdk/rust/inferlet" }
tot-core = { path = "../tot-core" }
gen-core = { path = "../gen-core" }
ratio-wire = { path = "../ratio-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
