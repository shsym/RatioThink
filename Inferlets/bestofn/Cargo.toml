[package]
name = "bestofn"
version = "0.1.0"
edition = "2024"
description = "Best-of-N inferlet: a thin shell over bestofn-core. No HTTP, no SSE."

[lib]
crate-type = ["cdylib"]

[dependencies]
inferlet = { path = "../../Vendor/pie/sdk/rust/inferlet" }
bestofn-core = { path = "../bestofn-core" }
gen-core = { path = "../gen-core" }
ratio-wire = { path = "../ratio-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
