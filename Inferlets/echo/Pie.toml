[package]
name = "echo"
version = "0.1.0"
description = "Transport conformance target: emits N events immediately, then returns"
authors = ["RatioThink"]

[runtime]
core = "^0.2.0"

# Descriptive only — pie does not enforce these.
[parameters]
count = {type = "int", optional = true, description = "events to emit before returning (default 4)"}
hold_ms = {type = "int", optional = true, description = "busy-hold after emitting, to keep the process alive for cancel tests (default 0)"}
