[package]
name = "echo"
version = "0.1.0"
edition = "2024"
description = "Transport conformance target: emits N events immediately, then returns."

[lib]
crate-type = ["cdylib"]

[dependencies]
inferlet = { path = "../../Vendor/pie/sdk/rust/inferlet" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wstd = "0.5.6"

[profile.release]
lto = true
