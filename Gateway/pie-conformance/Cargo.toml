[package]
name = "pie-conformance"
version = "0.1.0"
edition = "2024"
description = "Phase-1 gate: proves PIE's process transport does not lose events and honors cancellation."

[[bin]]
name = "pie-conformance"
path = "src/main.rs"

[dependencies]
pie-client = { path = "../../Vendor/pie/client/rust" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
