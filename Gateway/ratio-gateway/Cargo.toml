[package]
name = "ratio-gateway"
version = "0.1.0"
edition = "2024"
description = "HTTP/SSE gateway in front of the PIE engine. Owns ids, timestamps, statuses; inferlets own generation."

[[bin]]
name = "ratio-gateway"
path = "src/main.rs"

[dependencies]
pie-client = { path = "../../Vendor/pie/client/rust" }
ratio-wire = { path = "../../Inferlets/ratio-wire" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
futures = "0.3"
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
toml = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rmp-serde = "1.3"
tungstenite = "0.28"
