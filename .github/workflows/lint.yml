name: lint

# CI v2 (#456): required PR CI is intentionally lightweight and deterministic.
# The workflow is NOT top-level path-filtered, so protected checks never stay
# pending. Heavy/runtime coverage removed from this required path is preserved
# through the documented local make tiers in TEST.md:
#   - make local-pre-merge      (xcodebuild test-bundle compile, app-unit,
#                                scenario/smoke, HTTP E2E, real-pie contract,
#                                gmake canary)
#   - make local-gui-gate       (seated GUI/XCUITest)
#   - make local-e2e-gate       (real-engine/model/signing/live-service paths)
#   - make release-gate         (release-script/live-HF/readiness checks)
# Required PR jobs below keep only static/lint/provenance, compile/type checks,
# and cheap deterministic unit/contract tests.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      inferlets: ${{ steps.filter.outputs.inferlets }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            inferlets:
              - 'Inferlets/**'
              - 'Vendor/pie'
              - 'Scripts/stamp-chat-apc.sh'
              - 'Makefile'

  pr-static-gate:
    name: PR static gate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up xcodegen
        run: brew install xcodegen

      - name: Run lightweight deterministic PR gate
        run: make ci-pr

  inferlet-provenance:
    name: chat-apc inferlet provenance
    runs-on: macos-15
    needs: changes
    # Fail-open on detector failure: an errored/empty detector output must run
    # the cheap provenance checks rather than skip-as-Success. Keep != 'false'.
    if: ${{ !cancelled() && needs.changes.outputs.inferlets != 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache chat-apc cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "Inferlets/chat-apc"

      - name: Stamp helper unit tests
        run: make test-stamp

      - name: Inferlet Rust unit tests (native)
        run: make test-inferlets

      - name: Verify committed prebuilt matches stamp
        run: make verify-inferlets
